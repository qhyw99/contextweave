<p><strong>LLM (上游重试环) 负责：</strong></p>
<ul>
<li>决定删哪条边、哪些关系改用 tooltip</li>
<li>如何收敛成正确的布局风格</li>
<li>如何保住分区骨架和 mandatory containers</li>
<li>全局结构设计 + 语义级修改</li>
</ul>
<p><strong>Auto-fix (下游确定性修复) 负责：</strong></p>
<ul>
<li>短路径补全（相对路径→绝对路径）</li>
<li>节点嵌套（orphan node 放入容器）</li>
<li>Prefix merge（重复前缀合并）</li>
<li>形状归一化（shape normalisation）</li>
<li>这些是<strong>局部、机械、确定性</strong>修复</li>
<li>不替代 LLM 做全局结构设计</li>
</ul>
</div></foreignObject></g></g><g class="ZDJsaWI="><g class="shape" ><rect x="1033.000000" y="4645.000000" width="356.000000" height="672.000000" stroke="#880E4F" fill="#FCE4EC" style="stroke-width:2;" /></g><text x="1211.000000" y="4678.000000" fill="#880E4F" class="text" style="text-anchor:middle;font-size:28px"><tspan x="1211.000000" dy="0.000000">d2lib Direct Compile</tspan><tspan x="1211.000000" dy="32.000000">(Bypass Path)</tspan></text></g><g class="aW5zaWdodF9mYWlsdXJl"><g class="shape" ></g><g><foreignObject requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" x="668.000000" y="0.000000" width="609" height="284"><div xmlns="http://www.w3.org/1999/xhtml" class="md" style="background-color:#FFF9C4;color:#000000"><p><strong>核心洞察：为什么这次失败没有进入 extract auto-fix？</strong></p>
<ol>
<li>d2_lint_loop 重试 3 轮后最终写入 run_failed.log</li>
<li>理论上失败后应进入 extract-d2 下游链</li>
<li>但真实样本中第 3 轮 SEARCH/REPLACE 未应用，文件内容不变</li>
<li>上游直接终止，没有触发下游入口</li>
<li>如果第 3 轮成功进入 extract-d2 链，还需经过：
<ul>
<li>Validation Gate 的 LayoutGate + StructureDrift 并行检查</li>
<li>分类决策：必须是 soft warning 才能放行</li>
<li>如果是 blocking error，仍然回退终止</li>
</ul>
</li>
<li>结论：<strong>失败发生在安全网之外</strong>——上游重试耗尽后未进入下游验证链</li>
</ol>
</div></foreignObject></g></g><g class="ZDJfbGludF9sb29wLnJvdW5kMV9sYWJlbA=="><g class="shape" ><rect x="1501.000000" y="5425.000000" width="228.000000" height="63.000000" stroke="#4527A0" fill="#EDE7F6" style="stroke-width:2;" /></g><text x="1615.000000" y="5461.500000" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:14px">Round 1: Initial D2 generation</text></g><g class="ZDJfbGludF9sb29wLnJvdW5kMV9zdWJtaXQ="><g class="shape" ><rect x="1562.000000" y="5209.000000" width="212.000000" height="82.000000" stroke="#4527A0" fill="#EDE7F6" style="stroke-width:2;" /></g><text x="1668.000000" y="5247.500000" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1668.000000" dy="0.000000">Submit D2 to validation</tspan><tspan x="1668.000000" dy="18.500000">(lint / compile)</tspan></text></g><g class="ZDJfbGludF9sb29wLnJvdW5kMV9lcnJvcg=="><g class="shape" ><rect x="1534.000000" y="5012.000000" width="269.000000" height="66.000000" stroke="#C62828" fill="#FFEBEE" style="stroke-width:2;" /></g><text x="1668.500000" y="5050.500000" fill="#C62828" class="text-bold" style="text-anchor:middle;font-size:16px">LAYOUT_GATE_ERROR returned</text></g><g class="ZDJfbGludF9sb29wLmVycm9yX3JlcG9ydF8x"><g class="shape" ><rect x="1501.000000" y="4548.000000" width="335.000000" height="335.000000" stroke="#F9A825" fill="#FFF9C4" style="stroke-width:2;" /></g><text x="1668.500000" y="4705.000000" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1668.500000" dy="0.000000">Error report:</tspan><tspan x="1668.500000" dy="17.666667">• SandboxRouter: 6 connections &gt; 3 limit</tspan><tspan x="1668.500000" dy="17.666667">• SandboxClient: 4 connections &gt; 3 limit</tspan></text></g><g class="ZDJfbGludF9sb29wLmxsbV9kZWNpZGVzXzE="><g class="shape" ><rect x="1556.000000" y="4324.000000" width="226.000000" height="98.000000" stroke="#006064" fill="#E0F7FA" style="stroke-width:2;" /></g><text x="1669.000000" y="4362.5     (function () {
      const downloadButton = document.getElementById("download-svg-button");
      const canvas = document.querySelector(".canvas");
      if (!downloadButton || !canvas) {
        return;

      downloadButton.addEventListener("click", function () {
        const svg = canvas.querySelector("svg");
        if (!svg) {
          window.alert("当前页面未找到可导出的 SVG");
          return;
        }
        const serializer = new XMLSerializer();
        let svgSource = serializer.serializeToString(svg);
        if (!svgSource.includes("xmlns=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if (!svgSource.includes("xmlns:xlink=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }
        const blob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "diagram-3e0bad80-b20f-48ff-bfc3-3a16ed5146bb.svg";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      });
